  <main class="gallery-section">

        <div class="swiper-slide"><figure><img src="assets/img/image1.webp" alt="..."><figcaption>In August 2025 am fost la un eveniment numit Grand Rally Tour si am capturat pozele urmatoare</figcaption></figure></div>
        <div class="swiper-slide"><figure><img src="assets/img/image2.webp" alt="..."><figcaption></figcaption></figure></div>
        <div class="swiper-slide"><figure><img src="assets/img/image3.webp" alt="..."><figcaption></figcaption></figure></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="js/shared.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const swiperContainer = document.querySelector('.swiper');
    const swiper = new Swiper(swiperContainer, {
      effect: 'coverflow', grabCursor: true, centeredSlides: true, slidesPerView: 'auto', loop: true,
      /* Fix: Disabled slideShadows to massively boost performance */
      coverflowEffect: { rotate: 50, stretch: 0, depth: 100, modifier: 1, slideShadows: false, },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', },
      on: {
        slideChangeTransitionStart: function () { swiperContainer.classList.add('swiper-sliding'); },
        slideChangeTransitionEnd: function () { swiperContainer.classList.remove('swiper-sliding'); },
      },
    });
  });
</script>
</body>
